{% extends "base.html" %}
{% load static %}

{% block title %}Profile Page{% endblock %}

{% block content %}
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<style>
  body {
    background: linear-gradient(135deg, #c3dafe, #f5e0ff);
    min-height: 100vh;
  }

  .profile-card {
    background-color: #fff;
    border-radius: 15px;
    padding: 30px;
    max-width: 600px;
    width: 100%;
  }

  .profile-section {
    margin-bottom: 20px;
  }

  .profile-section label {
    font-weight: 500;
    color: #555;
  }

  .profile-label {
    font-weight: 600;
    color: #444;
  }

  .edit-toggle-btn {
    margin-top: 15px;
  }

  @media (max-width: 576px) {
    .profile-label {
      font-size: 14px;
    }
  }
</style>

<div class="container py-5 d-flex justify-content-center align-items-center">
  <div class="profile-card shadow-lg">
    <h3 class="text-center mb-4"><i class="bi bi-person-circle me-2"></i>User Profile</h3>

    <!-- Profile Display -->
    <div id="profileDisplay">
      <div class="row mb-3">
        <div class="col-6 profile-label"><i class="bi bi-person-fill me-2"></i>Name:</div>
        <div class="col-6">{{ user_obj.username }}</div>
      </div>
      <div class="row mb-3">
        <div class="col-6 profile-label"><i class="bi bi-telephone-fill me-2"></i>Phone:</div>
        <div class="col-6">{{ user_obj.phone_number }}</div>
      </div>
      <!-- <div class="row mb-3">
        <div class="col-6 profile-label"><i class="bi bi-envelope-fill me-2"></i>Email:</div>
        <div class="col-6">{{ user_obj.email }}</div>
      </div> -->

      <!-- <div class="text-end edit-toggle-btn">
        <button class="btn btn-outline-primary" onclick="toggleEdit()">
          <i class="bi bi-pencil-square me-1"></i>Edit Profile
        </button>
      </div> -->
    </div>

    <!-- Edit Form -->
    <form method="post" id="editForm" style="display: none;">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-person-fill me-1"></i>Name</label>
        <input type="text" name="username" value="{{ user_obj.username }}" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-envelope-fill me-1"></i>Email</label>
        <input type="email" name="email" value="{{ user_obj.email }}" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label"><i class="bi bi-telephone-fill me-1"></i>Phone Number</label>
        <input type="text" name="phone_number" value="{{ user_obj.phone_number }}" class="form-control" required>
      </div>

      <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-success">
          <i class="bi bi-check-circle me-1"></i>Update
        </button>
        <button type="button" class="btn btn-secondary" onclick="toggleEdit()">
          <i class="bi bi-x-circle me-1"></i>Cancel
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  function toggleEdit() {
    const form = document.getElementById("editForm");
    const display = document.getElementById("profileDisplay");
    const isVisible = form.style.display === "block";
    form.style.display = isVisible ? "none" : "block";
    display.style.display = isVisible ? "block" : "none";
  }
</script>
{% endblock %}
