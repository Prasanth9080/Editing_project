    </div>
    <button type="button" class="btn btn-sm btn-success" onclick="addBondInput()">+ Add More</button>

</div>

<script>
let bondIndex = 1;

function addBondInput() {
  const bondInputs = document.getElementById('bondInputs');

  const group = document.createElement('div');
  group.className = 'bond-input-group bg-secondary text-white border p-3 mb-3';
  group.innerHTML = `
    <div class="row">
      <div class="col-md-6 mb-3">
        <label><strong>Bond Image:</strong></label>
        <input type="file" name="bonds" accept="image/*" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label><strong>Company Name:</strong></label>
        <input type="text" name="companyname_${bondIndex}" placeholder="Company Name" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label><strong>Project Name:</strong></label>
        <input type="text" name="projectname_${bondIndex}" placeholder="Project Name" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label><strong>Amount:</strong></label>
        <input type="number" step="0.01" name="amount_${bondIndex}" placeholder="Amount" class="form-control" required>
      </div>
      <div class="col-md-6 mb-3">
        <label><strong>Investment Date:</strong></label>
        <input type="date" name="investment_date_${bondIndex}" class="form-control" placeholder="Investment Date" required>
      </div>
      <div class="col-md-6 mb-3">
        <label><strong>Customer ID:</strong></label>
        <input type="text" name="customer_id_${bondIndex}" placeholder="Customer ID" class="form-control" required>
      </div>
    </div>
  `;

  bondInputs.appendChild(group);
  bondIndex++;
}
</script>


<!-- Aadhar number -->

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const aadharInput = document.getElementById("aadharInput");

    aadharInput.addEventListener("input", function () {
      // Only digits, max 12
      let digits = this.value.replace(/\D/g, "").substring(0, 12);

      // Add space after every 4 digits: XXXX XXXX XXXX
      let formatted = '';
      for (let i = 0; i < digits.length; i++) {
        if (i > 0 && i % 4 === 0) formatted += ' ';
        formatted += digits[i];
      }

      this.value = formatted;
    });

    aadharInput.addEventListener("keydown", function (e) {
      const allowed = ["Backspace", "Delete", "ArrowLeft", "ArrowRight", "Tab"];
      if (allowed.includes(e.key)) return;

      // Block any non-digit key
      if (!/^\d$/.test(e.key)) {
        e.preventDefault();
      }
    });

    // Prevent invalid paste
    aadharInput.addEventListener("paste", function (e) {
      const data = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "");
      if (data.length > 12) e.preventDefault();
    });
  });
</script>

<!-- Contact of the leader -->

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const contactInput = document.querySelector('input[name="contactSH"]');

    contactInput.addEventListener("input", function () {
      // Remove all non-numeric characters
      this.value = this.value.replace(/\D/g, '');
    });

    contactInput.addEventListener("keydown", function (e) {
      const allowedKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab'];
      if (allowedKeys.includes(e.key)) return;

      // Block non-numeric keys
      if (!/^\d$/.test(e.key)) {
        e.preventDefault();
      }
    });
  });
</script>
