{% extends "base.html" %}
{% block content %}
<style>

  .container {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
    backdrop-filter: blur(8px);
    max-width: 450px;
    width: 100%;
    padding: 40px 30px;
    margin-top: 30px;
  }

  .container h2 {
    text-align: center;
    color: #1e3a8a;
    margin-bottom: 25px;
    font-size: 1.8rem;
  }

  form label {
    display: block;
    font-weight: 500;
    margin-bottom: 6px;
    margin-top: 15px;
    font-size: 0.95rem;
  }

  input[type="password"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    margin-bottom: 5px;
    transition: border-color 0.3s ease;
    font-size: 0.95rem;
  }

  input[type="password"]:focus {
    border-color: #6366f1;
    outline: none;
  }

  button[type="submit"] {
    width: 100%;
    padding: 12px;
    background: linear-gradient(to right, #6366f1, #3b82f6);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 1rem;
    font-weight: 500;
    margin-top: 20px;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  button[type="submit"]:hover {
    background: linear-gradient(to right, #4338ca, #2563eb);
  }

  .messages {
    margin-top: 15px;
    text-align: center;
  }

  .messages p {
    color: #dc2626;
    font-size: 14px;
  }

  /* ✅ Responsive adjustments */
  @media (max-width: 768px) {
    .container {
      padding: 30px 20px;
    }
    .container h2 {
      font-size: 1.5rem;
    }
    button[type="submit"] {
      font-size: 0.95rem;
      padding: 10px;
    }
  }

  @media (max-width: 480px) {
    .container {
      padding: 25px 15px;
      border-radius: 15px;
    }
    .container h2 {
      font-size: 1.3rem;
    }
    form label {
      font-size: 0.85rem;
    }
    input[type="password"] {
      padding: 10px;
      font-size: 0.9rem;
    }
    button[type="submit"] {
      font-size: 0.9rem;
      padding: 10px;
    }
  }
</style>

<div class="container">
  <h2>Change Password</h2>
  <form method="post">
    {% csrf_token %}
    <label>Old Password:</label>
    <input type="password" name="old_password" required>

    <label>New Password:</label>
    <input type="password" name="new_password1" required>

    <label>Confirm New Password:</label>
    <input type="password" name="new_password2" required>

    <button type="submit">Change Password</button>
  </form>

  <div class="messages">
    {% for message in messages %}
      <p>{{ message }}</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
